<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Karen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12; --bg2:#0d141f; --panel:#0e1621; --border:#1c2b3d;
  --text:#dbe8f5; --text-dim:#5c7691; --accent:#36d6ff; --accent-dim:#1a3a4a;
  --accent2:#7afcd6; --danger:#ff5d6c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',Arial,sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.brand{font-family:'Orbitron',Arial,sans-serif}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;flex-shrink:0;
}
.brand{font-size:20px;letter-spacing:4px;color:var(--accent);text-transform:uppercase}
.status{font-size:12px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);transition:background .3s,box-shadow .3s}
.status-dot.live{background:var(--accent2);box-shadow:0 0 10px var(--accent2)}

.core-wrap{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  padding:6px 0 2px;position:relative;
}
.core{position:relative}
.core svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.tabs{display:flex;gap:8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;text-align:center;padding:9px 14px;border-radius:10px;
  font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);
  background:var(--panel);border:1px solid var(--border);cursor:pointer;
  white-space:nowrap;
}
.tab.active{color:var(--accent2);border-color:var(--accent-dim)}

.view{flex:1;min-height:0;overflow-y:auto;display:none;flex-direction:column;gap:10px;padding:4px 2px 8px}
.view.active{display:flex}

.line{font-size:15px;line-height:1.45;max-width:92%}
.line.user{color:var(--text);align-self:flex-end;text-align:right}
.line.jarvis{color:var(--accent2)}
.line .who{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px}

.reminder{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;
}
.reminder .txt{flex:1;font-size:15px;line-height:1.3;min-width:0}
.reminder .when{display:block;font-size:11px;color:var(--text-dim);margin-top:2px}
.reminder .del{
  background:none;border:none;color:var(--danger);font-size:18px;line-height:1;
  padding:4px 6px;cursor:pointer;flex-shrink:0;
}
.empty{color:var(--text-dim);font-size:14px;text-align:center;padding:30px 10px}

.total-card{
  background:var(--panel);border:1px solid var(--accent-dim);border-radius:14px;
  padding:16px 18px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;
}
.total-card .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim)}
.total-card .value{font-size:30px;font-weight:600;color:var(--accent2);font-variant-numeric:tabular-nums}

.expense{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;
}
.expense .txt{flex:1;font-size:15px;line-height:1.3;min-width:0}
.expense .when{display:block;font-size:11px;color:var(--text-dim);margin-top:2px}
.expense .valor{font-size:16px;font-weight:600;color:var(--accent2);font-variant-numeric:tabular-nums;white-space:nowrap}
.expense .del{
  background:none;border:none;color:var(--danger);font-size:18px;line-height:1;
  padding:4px 0 4px 6px;cursor:pointer;flex-shrink:0;
}

.task{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;
}
.task .check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--accent-dim);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:none;color:var(--accent2);font-size:13px;cursor:pointer;padding:0;
}
.task.done .check{background:var(--accent-dim);border-color:var(--accent2)}
.task .txt{flex:1;font-size:15px;line-height:1.3;min-width:0}
.task.done .txt{color:var(--text-dim);text-decoration:line-through}
.task .del{
  background:none;border:none;color:var(--danger);font-size:18px;line-height:1;
  padding:4px 0 4px 6px;cursor:pointer;flex-shrink:0;
}

.cart-item{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;
}
.cart-item .check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--accent-dim);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:none;color:var(--accent2);font-size:13px;cursor:pointer;padding:0;
}
.cart-item.done .check{background:var(--accent-dim);border-color:var(--accent2)}
.cart-item .txt{flex:1;font-size:15px;line-height:1.3;min-width:0}
.cart-item.done .txt{color:var(--text-dim);text-decoration:line-through}
.cart-item .valor{font-size:14px;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.cart-item .del{
  background:none;border:none;color:var(--danger);font-size:18px;line-height:1;
  padding:4px 0 4px 6px;cursor:pointer;flex-shrink:0;
}

.timer-pill{
  display:none;align-items:center;gap:8px;align-self:center;
  background:var(--panel);border:1px solid var(--accent-dim);border-radius:999px;
  padding:6px 16px;margin-bottom:4px;flex-shrink:0;
}
.timer-pill.active{display:flex}
.timer-pill .t{font-size:16px;font-weight:600;color:var(--accent2);font-variant-numeric:tabular-nums}
.timer-pill .cancel{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer}
.controls{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 0 max(16px, env(safe-area-inset-bottom,0px));
}
.hint{font-size:12px;color:var(--text-dim);text-align:center;min-height:16px}
.mic-btn{
  width:64px;height:64px;border-radius:50%;
  background:var(--panel);border:2px solid var(--accent-dim);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .2s,color .2s,transform .1s;
}
.mic-btn:active{transform:scale(.95)}
.mic-btn.on{border-color:var(--accent);color:var(--accent2);box-shadow:0 0 24px var(--accent-dim)}
.mic-btn svg{width:24px;height:24px}

.type-row{display:flex;gap:8px;width:100%;max-width:420px}
.type-row input{
  flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:15px;padding:10px 12px;
}
.type-row input:focus{outline:none;border-color:var(--accent-dim)}
.type-row button{
  background:var(--panel);border:1px solid var(--accent-dim);color:var(--accent2);
  border-radius:10px;padding:0 16px;font-size:14px;cursor:pointer;
}

/* ---------- visual tecnológico ---------- */
body{
  background:
    radial-gradient(ellipse at 50% 18%, rgba(54,214,255,.10), transparent 60%),
    linear-gradient(rgba(54,214,255,.035) 1px, transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg, rgba(54,214,255,.035) 1px, transparent 1px) 0 0/28px 100%,
    var(--bg);
}
.brand{text-shadow:0 0 12px rgba(54,214,255,.55)}
.brand small{font-size:9px;letter-spacing:3px;color:var(--text-dim);display:block;margin-top:2px;text-shadow:none}
.tab{font-family:'Orbitron',Arial,sans-serif;font-size:10px;letter-spacing:1.5px}
.tab.active{background:linear-gradient(180deg,rgba(54,214,255,.14),rgba(54,214,255,.02));box-shadow:inset 0 -2px 0 var(--accent2)}
.reminder,.expense,.task,.cart-item,.agenda-item,.total-card,.card{position:relative}
.reminder::before,.expense::before,.task::before,.cart-item::before,.agenda-item::before,.card::before{
  content:"";position:absolute;left:-1px;top:-1px;width:10px;height:10px;
  border-left:2px solid var(--accent);border-top:2px solid var(--accent);border-top-left-radius:12px;opacity:.7;
}

/* ---------- rosto com expressões ---------- */
.core{width:min(46vw,200px);height:min(46vw,200px);transition:width .3s,height .3s;cursor:pointer;-webkit-tap-highlight-color:transparent}
body.modo-terra .core{width:84px;height:84px}
.hud-ring{fill:none;stroke:var(--accent);stroke-width:1.2;opacity:.55;transform-origin:100px 100px}
.hud-ring.r1{stroke-dasharray:3 6;animation:spin 30s linear infinite}
.hud-ring.r2{stroke-dasharray:46 18 8 18;stroke-width:2.4;opacity:.75;animation:spin 14s linear infinite reverse}
.hud-ring.r3{stroke:var(--accent2);stroke-dasharray:1 3;opacity:.4;animation:spin 50s linear infinite}
.core.listening .hud-ring.r2{animation-duration:3s;stroke:var(--accent2)}
.core.speaking .hud-ring.r2{animation-duration:5s}
.face-plate{fill:rgba(54,214,255,.06);stroke:var(--accent-dim);stroke-width:1.5}
.core.listening .face-plate{fill:rgba(122,252,214,.10);stroke:var(--accent2)}
.core.alert .face-plate{animation:alerta .4s ease-in-out infinite}
@keyframes alerta{50%{fill:rgba(255,93,108,.22)}}
.feature{transform-box:fill-box;transform-origin:center;transition:transform .28s ease}
.eye{fill:var(--accent2);filter:drop-shadow(0 0 4px var(--accent2))}
.blinker{transform-box:fill-box;transform-origin:center;animation:piscar 5.5s infinite}
@keyframes piscar{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.brow{stroke:var(--accent);stroke-width:3;stroke-linecap:round;opacity:.9}
.mouth{fill:none;stroke:var(--accent2);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--accent2))}
.expr-label{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);font-family:'Orbitron',Arial,sans-serif;white-space:nowrap}
body.modo-terra .expr-label{display:none}

/* ---------- agenda do dia ---------- */
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-shrink:0}
.day-head .d{font-family:'Orbitron',Arial,sans-serif;font-size:13px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.day-head .n{font-size:12px;color:var(--text-dim)}
.section-t{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-top:6px}
.agenda-item{
  display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;
}
.agenda-item .hora{font-family:'Orbitron',Arial,sans-serif;font-size:13px;color:var(--accent2);min-width:48px;font-variant-numeric:tabular-nums}
.agenda-item .txt{flex:1;font-size:15px;line-height:1.3;min-width:0}
.agenda-item.done .txt{color:var(--text-dim);text-decoration:line-through}
.agenda-item.passou .hora{color:var(--text-dim)}
.agenda-item .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent-dim);background:none;color:var(--accent2);font-size:13px;cursor:pointer;padding:0;flex-shrink:0}
.agenda-item.done .check{background:var(--accent-dim);border-color:var(--accent2)}
.agenda-item .del,.reminder .del{background:none;border:none;color:var(--danger);font-size:18px;line-height:1;padding:4px 0 4px 6px;cursor:pointer;flex-shrink:0}
.add-row{display:flex;gap:8px;flex-shrink:0}
.add-row input{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:10px 12px}
.add-row input[type=text]{flex:1}
.add-row input[type=time]{width:96px}
.add-row button{background:var(--panel);border:1px solid var(--accent-dim);color:var(--accent2);border-radius:10px;padding:0 14px;font-size:18px;cursor:pointer}
.when.alarme{color:var(--accent)}

/* ---------- planeta Terra ---------- */
#view-earth{padding:0;gap:8px;overflow:hidden}
.earth-search{display:flex;gap:8px;flex-shrink:0;position:relative}
.earth-search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:10px 12px}
.earth-search input:focus{outline:none;border-color:var(--accent-dim)}
.sugestoes{position:absolute;top:44px;left:0;right:0;z-index:5;background:var(--bg2);border:1px solid var(--accent-dim);border-radius:10px;max-height:220px;overflow-y:auto;display:none}
.sugestoes.on{display:block}
.sugestoes div{padding:10px 12px;font-size:14px;border-bottom:1px solid var(--border);cursor:pointer}
.sugestoes div small{color:var(--text-dim);margin-left:6px}
.globe-wrap{flex:1;min-height:240px;position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#0b1c2c,#04070c 70%)}
.globe-el{position:absolute;inset:0;overflow:hidden}
.globe-wrap .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;letter-spacing:2px;text-transform:uppercase;text-align:center;padding:20px}
.gl-lbl{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:4px;transform:translate(-4px,-50%);white-space:nowrap;font-family:Arial,sans-serif}
.gl-lbl i{width:6px;height:6px;border-radius:50%;background:#7afcd6;box-shadow:0 0 6px #7afcd6;flex-shrink:0}
.gl-lbl.cap i{background:#ffd479;box-shadow:0 0 6px #ffd479;width:7px;height:7px;transform:rotate(45deg);border-radius:1px}
.gl-lbl span{font-size:10px;color:#dbe8f5;text-shadow:0 0 3px #000,0 0 6px #000}
.gl-lbl.cap span{color:#ffd479;font-size:11px}
.gl-lbl.cidade span{color:#7afcd6}
.country-card{
  position:absolute;left:8px;right:8px;bottom:8px;z-index:4;background:rgba(8,14,22,.88);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--accent-dim);border-radius:12px;padding:12px 14px;display:none;max-height:48%;overflow-y:auto
}
.country-card.on{display:block}
.country-card .nm{font-family:'Orbitron',Arial,sans-serif;font-size:15px;color:var(--accent2);letter-spacing:1px;padding-right:28px}
.country-card .meta{font-size:13px;color:var(--text);margin-top:4px;line-height:1.5}
.country-card .meta b{color:#ffd479;font-weight:600}
.country-card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.country-card .chips button{background:rgba(54,214,255,.08);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.country-card .x{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer}
.legend{position:absolute;top:8px;left:10px;z-index:3;font-size:10px;color:var(--text-dim);letter-spacing:1px;display:flex;gap:10px;pointer-events:none}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7afcd6}
.legend i.c{background:#ffd479;transform:rotate(45deg);border-radius:1px}

/* ---------- ajustes ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:'Orbitron',Arial,sans-serif;font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:500;text-transform:uppercase}
.card label{font-size:13px;color:var(--text-dim);display:flex;flex-direction:column;gap:6px}
.card select,.card input[type=text]{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;padding:9px 10px;width:100%}
.card input[type=range]{width:100%;accent-color:var(--accent2)}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card button{background:var(--bg2);border:1px solid var(--accent-dim);color:var(--accent2);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.card p{margin:0;font-size:12px;color:var(--text-dim);line-height:1.5}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">KAREN<small>ASSISTENTE PESSOAL</small></div>
  <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">Em espera</span></div>
</div>

<div class="core-wrap">
  <div class="core" id="core" role="button" aria-label="Rosto da Karen">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="hud-ring r1" cx="100" cy="100" r="96"/>
      <circle class="hud-ring r2" cx="100" cy="100" r="86"/>
      <circle class="hud-ring r3" cx="100" cy="100" r="76"/>
      <circle class="face-plate" cx="100" cy="100" r="64"/>
      <line class="brow feature" id="browL" x1="72" y1="72" x2="94" y2="72"/>
      <line class="brow feature" id="browR" x1="106" y1="72" x2="128" y2="72"/>
      <g class="feature" id="eyeL"><g class="blinker"><ellipse class="eye" cx="83" cy="92" rx="7" ry="10"/></g></g>
      <g class="feature" id="eyeR"><g class="blinker"><ellipse class="eye" cx="117" cy="92" rx="7" ry="10"/></g></g>
      <path class="mouth" id="mouth" d="M82 128 Q100 133 118 128"/>
    </svg>
    <div class="expr-label" id="exprLabel">neutro</div>
  </div>
</div>

<div class="timer-pill" id="timerPill">
  <span class="t" id="timerText">00:00</span>
  <button class="cancel" id="timerCancel" type="button">cancelar</button>
</div>

<div class="panel">
  <div class="tabs">
    <div class="tab active" data-tab="chat">Conversa</div>
    <div class="tab" data-tab="today">Hoje</div>
    <div class="tab" data-tab="earth">Terra</div>
    <div class="tab" data-tab="reminders">Lembretes</div>
    <div class="tab" data-tab="cart">Compras</div>
    <div class="tab" data-tab="expenses">Gastos</div>
    <div class="tab" data-tab="tasks">Tarefas</div>
    <div class="tab" data-tab="notes">Notas</div>
    <div class="tab" data-tab="settings">Ajustes</div>
  </div>

  <div class="view active" id="view-chat"></div>

  <div class="view" id="view-today"></div>

  <div class="view" id="view-earth">
    <div class="earth-search">
      <input type="text" id="earthInput" placeholder="Buscar país ou cidade..." autocomplete="off">
      <div class="sugestoes" id="earthSug"></div>
    </div>
    <div class="globe-wrap zoom-longe" id="globeWrap">
      <div class="legend"><span><i class="c"></i>capital</span><span><i></i>cidade</span></div>
      <div class="globe-el" id="globeEl"></div>
      <div class="loading" id="globeLoading">Carregando planeta...</div>
      <div class="country-card" id="countryCard"></div>
    </div>
  </div>

  <div class="view" id="view-reminders"></div>

  <div class="view" id="view-expenses"></div>

  <div class="view" id="view-cart"></div>

  <div class="view" id="view-tasks"></div>

  <div class="view" id="view-notes"></div>

  <div class="view" id="view-settings"></div>
</div>

<div class="controls">
  <div class="hint" id="hint">Toque no botão e fale com a Karen</div>
  <button class="mic-btn" id="micBtn" aria-label="Falar com a Karen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
      <line x1="12" y1="19" x2="12" y2="23"/>

  function paraNumero(str){
    return parseFloat(str.replace(/\./g, '').replace(',', '.'));
  }

  function extrairGasto(fala){
    var padroesValorPrimeiro = [
      /gast(?:ei|o)\s+(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais?)?\s*(?:com|em|no|na|de)?\s*(.*)/i,
      /pagu(?:ei)\s+(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais?)?\s*(?:por|com|em|no|na)?\s*(.*)/i,
      /(?:novo gasto|anota(?:r)? um gasto|coloca(?:r)? um gasto)(?:\s+de)?\s+(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais?)?\s*(?:com|em|no|na|de)?\s*(.*)/i,
      /usei\s+(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais?)?\s*(?:com|em|no|na|de)?\s*(.*)/i
    ];
    for (var i = 0; i < padroesValorPrimeiro.length; i++){
      var m = fala.match(padroesValorPrimeiro[i]);
      if (m && m[1]){
        return { valor: paraNumero(m[1]), descricao: (m[2] || '').trim() };
      }
    }
    var m2 = fala.match(/compr(?:ei)\s+(.*?)\s+por\s+(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais?)?/i);
    if (m2 && m2[2]){
      return { valor: paraNumero(m2[2]), descricao: (m2[1] || '').trim() };
    }
    return null;
  }

  // ---------- carrinho de compras (guardado no navegador) ----------
  var CARRINHO_KEY = 'jarvis_carrinho';

    try{

  function extrairCarrinho(fala){
    // primeiro procura o preço em QUALQUER posição da frase (antes ou depois de "carrinho")
    var valor = null;
    var trabalho = fala;
    var mv = trabalho.match(/(?:por|de)\s+(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais?)?/i);
    if (mv){
      valor = paraNumero(mv[1]);
      trabalho = trabalho.replace(mv[0], ' ').trim();
    }

    var texto = null;

    // formato natural: "LED no carrinho" / "coloca o LED no carrinho" (item antes de "carrinho")
    var m1 = trabalho.match(/(.+?)\s+(?:no|na|ao|pro|para o)\s+(?:carrinho|lista de compras)\b/i);
    if (m1 && m1[1] && m1[1].trim().length > 1){
      texto = m1[1].trim().replace(/^(?:adiciona(?:r)?|coloca(?:r)?|p[oõ]e)\s+/i, '').trim();
      // se sobrou só o verbo (ex: "adiciona ao carrinho X" — o item vem depois), descarta e tenta de novo
      if (/^(?:adiciona(?:r)?|coloca(?:r)?|p[oõ]e)$/i.test(texto)) texto = null;
    }

    // formato com palavra-chave primeiro: "carrinho: LED" / "adiciona no carrinho o LED"
    if (!texto){
      var m2 = trabalho.match(/(?:carrinho|lista de compras)[:\s]+(.+)/i);
      if (m2 && m2[1] && m2[1].trim().length > 1) texto = m2[1].trim();
    }

    if (!texto) return null;

    texto = texto.replace(/^(?:o|a|os|as|um|uma)\s+/i, '').trim();
    texto = texto.replace(/\s{2,}/g, ' ').trim();
    if (!texto) texto = 'item';
    return { texto: texto, valor: valor };
  }

  function extrairTarefa(fala){
    var m = fala.match(/tarefa(?:\s+nova)?(?:\s*:|\s+de|\s+para)?\s*(.+)/i);
    if (m && m[1] && m[1].trim().length > 1) return m[1].trim();
    var m2 = fala.match(/(?:preciso|tenho que|tenho de)\s+fazer\s+(.+)/i);
    if (m2 && m2[1] && m2[1].trim().length > 1) return m2[1].trim();

  // ---------- notas (guardadas no navegador) ----------
  var NOTAS_KEY = 'jarvis_notas';

      /nota[:\s]+(.+)/i,
      /cri(?:a|ar) uma nota(?: sobre| de)?[:\s]*(.+)/i,
      /nova nota[:\s]*(.+)/i,
      /guarda (?:isso|essa informa[cç][aã]o|essa ideia)(?:\s+que)?\s*[:,]?\s*(.+)/i
    ];
    for (var i = 0; i < padroes.length; i++){
      var m = fala.match(padroes[i]);
      if (m && m[1] && m[1].trim().length > 1) return m[1].trim();

  // ---------- timer ----------
  var TIMER_KEY = 'jarvis_timer_fim';
  var timerInterval = null;

  var timerText = document.getElementById('timerText');
  var timerCancelBtn = document.getElementById('timerCancel');

  function formatarMMSS(segundosTotais){
    var m = Math.floor(segundosTotais / 60);
    var s = segundosTotais % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function pararTimerVisual(){
    if (timerInterval){ clearInterval(timerInterval); timerInterval = null; }

    core.classList.remove('alert');

    try{ localStorage.removeItem(TIMER_KEY); }catch(e){}
    pararTimerVisual();

  function timerTerminou(){
    pararTimerVisual();
    try{ localStorage.removeItem(TIMER_KEY); }catch(e){}
    core.classList.add('alert');
    if (navigator.vibrate){ try{ navigator.vibrate([300,150,300,150,300]); }catch(e){} }
    falar('Seu timer acabou!');
    setTimeout(function(){ core.classList.remove('alert'); }, 4000);

  function atualizarTimerDisplay(fimMs){
    var restanteMs = fimMs - Date.now();

  (function retomarTimer(){
    try{
      var fimSalvo = parseInt(localStorage.getItem(TIMER_KEY), 10);
      if (fimSalvo && fimSalvo > Date.now()){
        if (timerInterval) clearInterval(timerInterval);
        atualizarTimerDisplay(fimSalvo);
        timerInterval = setInterval(function(){ atualizarTimerDisplay(fimSalvo); }, 1000);
      }
    }catch(e){}
  })();

  function extrairTimer(fala){
    var m = fala.match(/(?:timer|cron[oô]metro|despertador|daqui a|me avisa)[^\d]*?(\d+)\s*(minutos?|min|segundos?|seg)\b/i);
    if (!m) return null;
    var valor = parseInt(m[1], 10);
    var unidade = m[2].toLowerCase();
    var segundos = (unidade.indexOf('min') === 0) ? valor * 60 : valor;
    return segundos;
  }

  // ---------- entender o que foi falado ----------
  function extrairLembrete(fala){
    var padroes = [
      /lembr(?:a|ete)(?:\s+nov[ao])?(?:\s*:|\s+de|\s+que|\s+para)?\s*(.+)/i,
      /anota (?:que|a[ií])?\s*(.+)/i,
      /n[aã]o deixa eu esquecer (?:de|que)?\s*(.+)/i,

  // ---------- utilidades de texto ----------
  function semAcento(s){
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function dataISO(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function hojeISO(){ return dataISO(new Date()); }
  function maisDias(n){ var d = new Date(); d.setDate(d.getDate() + n); return dataISO(d); }

  // entende "amanhã às 15h", "hoje 9:30", "às 8 da noite", "meio-dia"...
  function extrairQuando(texto, empurrarSePassou){
    var resto = ' ' + texto + ' ';
    var data = null, hora = null;
    var n = semAcento(texto);
    if (/depois de amanha/.test(n)){ data = maisDias(2); resto = resto.replace(/depois de amanh[ãa]/i, ' '); }
    else if (/\bamanha\b/.test(n)){ data = maisDias(1); resto = resto.replace(/amanh[ãa]/i, ' '); }
    else if (/\bhoje\b/.test(n)){ data = hojeISO(); resto = resto.replace(/\bhoje\b/i, ' '); }

    var m = resto.match(/\s(?:[àa]s?\s+|para as\s+|pras?\s+)?(\d{1,2})\s*(?:[:h]\s*(\d{2})|h(?:oras?)?\b|\s*horas?\b)(\s+(?:da|de)\s+(manh[ãa]|tarde|noite|madrugada))?/i)
         || resto.match(/\s(?:[àa]s?)\s+(\d{1,2})(\s+(?:da|de)\s+(manh[ãa]|tarde|noite|madrugada))?/i);
    if (m){
      var h = parseInt(m[1], 10);
      var min = (m[2] && /^\d{2}$/.test(m[2])) ? parseInt(m[2], 10) : 0;
      var periodo = semAcento(m[4] || m[3] || '');
      if ((periodo.indexOf('tarde') !== -1 || periodo.indexOf('noite') !== -1) && h < 12) h += 12;
      if (h <= 23 && min <= 59){
        hora = String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
        resto = resto.replace(m[0], ' ');
      }
    } else if (/meio[- ]dia/i.test(resto)){
      hora = '12:00'; resto = resto.replace(/(?:ao |[àa]o?\s+)?meio[- ]dia/i, ' ');
    } else if (/meia[- ]noite/i.test(resto)){
      hora = '00:00'; resto = resto.replace(/(?:[àa]\s+)?meia[- ]noite/i, ' ');
    }
    if (hora && !data){
      data = hojeISO();
      if (empurrarSePassou && new Date(data + 'T' + hora) < new Date()) data = maisDias(1);
    }
    resto = resto.replace(/\s+/g, ' ').replace(/^\s*(?:de|que|para|pra|a|o)\s+/i, '').replace(/\s+(?:de|que|para|pra|às|as|a)\s*$/i, '').trim();
    return { data: data, hora: hora, resto: resto };
  }
  function descreverQuando(data, hora){
    if (!data) return '';

    return dia + (hora ? (' às ' + hora.replace(':00', 'h').replace(':', 'h')) : '');
  }

  function responderGeografia(fala){
    var t = semAcento(fala);
    var querGlobo = /\b(globo|planeta|mapa|terra 3d|mundo)\b/.test(t);
    if (/\b(abre|abrir|mostra|mostrar|ver)\b/.test(t) && querGlobo && !acharLugar(fala)){

    var lugar = acharLugar(fala);

    var p = paisPorIso[lugar.iso];
    var a = artigo(p.nome);
    exprResposta = 'feliz';
    if (/capital/.test(t) && lugar.tipo === 'pais'){

      return p.capital ? ('A capital ' + a.de + ' ' + p.nome + ' é ' + p.capital.nome + '.') : (p.nome + ' não tem uma capital oficial.');
    }
    if (/cidades/.test(t)){
      mostrarNoGlobo({ tipo:'pais', iso:p.iso });
      var nomes = p.cidades.slice(0, 6).map(function(c){ return c.nome; });
      return 'Principais cidades ' + a.de + ' ' + p.nome + ': ' + (p.capital ? p.capital.nome + ' (a capital), ' : '') + nomes.join(', ') + '.';
    }
    mostrarNoGlobo(lugar);
    if (lugar.tipo === 'pais'){
      return p.nome + ' fica ' + (p.regiao === 'Américas' ? 'nas Américas' : (p.regiao === 'Antártida' ? 'na Antártida' : ('n' + (p.regiao === 'Oceania' || p.regiao === 'Europa' || p.regiao === 'Ásia' || p.regiao === 'África' ? 'a ' : 'o ') + p.regiao))) +
        '. A capital é ' + (p.capital ? p.capital.nome : 'não definida') + '. Estou mostrando no globo.';
    }
    if (lugar.tipo === 'capital') return lugar.nome + ' é a capital ' + a.de + ' ' + p.nome + '. Estou mostrando no globo.';
    return lugar.nome + ' é uma cidade ' + a.de + ' ' + p.nome + (lugar.pop ? (', com cerca de ' + formatarPop(lugar.pop).replace(' hab.', ' de habitantes')) : '') + '. Estou mostrando no globo.';

  // ---------- frases e expressões do dia a dia ----------
  function responderExpressoes(fala){

    if (tem(/\b(faz|faca|fica|mostra|mostre|cara|expressao|carinha|sorri|sorria|dorme)\b/)){
      for (var k in mapaPedido){
        if (new RegExp('\\b' + k + '\\b').test(t)){
          exprResposta = mapaPedido[k];
          return escolher({
            feliz:['Assim está bom? Um sorriso para você.', 'Feliz da vida!'], triste:['Olha minha cara de triste...', 'Snif. Assim?'],
            bravo:['Grrr! Brincadeira, não consigo ficar brava com você.'], surpreso:['Uau! Que surpresa!'], pensando:['Hmm... deixa eu pensar.'],

        }
      }

        var lista = ['feliz','surpreso','pensando','triste','rindo','neutro'];
        lista.forEach(function(e, i){ setTimeout(function(){ setExpressao(e); }, i * 900); });
        exprResposta = 'feliz';
        return 'Eu sei fazer várias caras: feliz, triste, surpresa, pensativa, brava, confusa e rindo. É só pedir, tipo: Karen, fica feliz.';
      }
    }
    if (tem(/\b(to|tou|estou|t[oô]|me sinto|ando) (muito |meio |bem |um pouco )?(triste|mal|pra baixo|deprimid[oa]|chatead[oa])\b/)){ exprResposta = 'triste'; return escolher(['Sinto muito ouvir isso, Francisco. Quer que eu conte uma piada para animar?', 'Poxa. Se quiser conversar, estou aqui. Às vezes uma pausa e um copo de água ajudam.']); }
    if (tem(/\b(to|tou|estou|me sinto) (muito |bem |super )?(feliz|alegre|bem|otimo|animad[oa])\b/)){ exprResposta = 'feliz'; return escolher(['Que ótimo! Fico feliz por você.', 'Excelente notícia, Francisco!']); }
    if (tem(/\b(to|tou|estou) (muito |bem |um pouco )?(cansad[oa]|exaust[oa]|com sono)\b/)){ exprResposta = 'triste'; return 'Que tal uma pausa? Se quiser, diga "timer de 15 minutos" e eu te aviso quando acabar.'; }
    if (tem(/\b(to|tou|estou) (com )?(fome)\b/)){ exprResposta = 'pensando'; return 'Hora de comer alguma coisa! Quer que eu coloque algo na lista de compras?'; }

  function pontuacaoVoz(v){
    var nome = v.name.toLowerCase();

    if (v.lang && v.lang.toLowerCase().indexOf('pt') === 0) pontos += 10;
    if (v.lang && v.lang.toLowerCase() === 'pt-br') pontos += 4;
    // nomes conhecidos de vozes masculinas em pt-BR, nas plataformas mais comuns
    ['felipe','daniel','ricardo','diego','thiago','rodrigo','male','masculin'].forEach(function(palavra){
      if (nome.indexOf(palavra) !== -1) pontos += 20;
    });
    ['luciana','female','feminin','maria','joana'].forEach(function(palavra){
      if (nome.indexOf(palavra) !== -1) pontos -= 15;
    });
    if (nome.indexOf('google') !== -1) pontos += 2;
    return pontos;

  function escolherMelhorVoz(){
    if (!synth) return null;
    var vozes = synth.getVoices() || [];
    if (!vozes.length) return null;
    if (cfg.voz){
      var escolhida = vozes.filter(function(v){ return v.name === cfg.voz; })[0];
      if (escolhida) return escolhida;
    }
    // primeiro só considera vozes em português; só usa outra língua se o aparelho não tiver nenhuma
    var candidatas = vozes.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('pt') === 0; });
    if (!candidatas.length) candidatas = vozes;
    var melhor = null;
    var melhorPontos = -Infinity;
    candidatas.forEach(function(v){
      var p = pontuacaoVoz(v);
      if (p > melhorPontos){ melhorPontos = p; melhor = v; }
    });
    return melhor;
  }

  // "tu", "vc", "cê" e "contigo" viram "você" pra Karen entender igual
  function trocarTuPorVoce(fala){

    }
    ultimaRespostaKaren = resposta;
    guardarHistorico('karen', resposta);
    falar(resposta, expressaoPara(fala, resposta));
  }

  // ---------- voz -> texto ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognizing = false;
  var recognition = null;

  if (!SR){
    hint.textContent = 'Seu navegador não tem reconhecimento de voz. Tente no Chrome ou no Safari atualizado.';
    micBtn.disabled = true;
    micBtn.style.opacity = '0.4';
  } else {
    recognition = new SR();
    recognition.lang = 'pt-BR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){
      recognizing = true;
      micBtn.classList.add('on');
      core.classList.add('listening');
      setExpressao('ouvindo');
      setStatus('Ouvindo', true);
      hint.textContent = 'Pode falar...';
    };

    recognition.onresult = function(e){
      responder(e.results[0][0].transcript);
    };

    recognition.onerror = function(e){
      hint.textContent = (e.error === 'not-allowed')
        ? 'Permissão de microfone negada. Ative nas configurações do navegador.'
        : 'Não entendi, tenta de novo.';
      setExpressao('confuso', 2500);
    };

    recognition.onend = function(){
      recognizing = false;
      micBtn.classList.remove('on');
      core.classList.remove('listening');
      if (!core.classList.contains('speaking')){ setStatus('Em espera', false); if (exprAtual === 'ouvindo') setExpressao('neutro'); }
    };

    micBtn.addEventListener('click', function(){
      if (recognizing){ recognition.stop(); return; }
      try{
        synth && synth.cancel();
        recognition.start();
      }catch(err){}
    });
  }

  var typeForm = document.getElementById('typeForm');
  var typeInput = document.getElementById('typeInput');
  typeForm.addEventListener('submit', function(e){
    e.preventDefault();
    var texto = typeInput.value.trim();
    if (!texto) return;
    typeInput.value = '';
    responder(texto);
  });
})();
</script>
</body>
</html>
