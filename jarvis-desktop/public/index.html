<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Barra de cima: nome, data/hora e clima -->
  <header class="topbar">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="info">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="weather" id="weather">
      <span class="weather-temp" id="weatherTemp">--°</span>
      <span class="weather-desc" id="weatherDesc">Rio de Janeiro</span>
    </div>
  </header>

  <!-- Núcleo holográfico -->
  <main class="stage">
    <div class="core" id="core" data-state="idle" title="Clique para ver os estados do núcleo">
      <svg class="ring ring-outer" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="96" class="dash-long"/>
      </svg>
      <svg class="ring ring-mid" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="96" class="dash-ticks"/>
      </svg>
      <svg class="ring ring-inner" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="96" class="dash-arcs"/>
      </svg>
      <div class="orb"><div class="orb-inner"></div></div>
    </div>
    <div class="status" id="status">Em espera</div>
  </main>

  <!-- Legenda e controles -->
  <footer class="bottom">
    <div class="caption" id="caption" aria-live="polite">Bom dia, Senhor. Todos os sistemas operacionais.</div>
    <div class="controls">
      <button class="mic" id="micBtn" disabled title="A voz chega na etapa 2">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <label class="toggle">
        <input type="checkbox" id="liteToggle">
        <span>Modo leve</span>
      </label>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
